<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title lang-key="title">XMSLEEP — 在线白噪音播放</title>
<meta name="description" lang-key="desc" content="在浏览器中直接播放 XMSLEEP 的 113 款自然声音，自由混音">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;
  --surface:rgba(255,255,255,0.05);
  --surface-hover:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.12);
  --text:#fff;
  --text2:#8a8a8a;
  --radius:14px;
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:1100px;margin:0 auto;padding:0 24px}

/* ---------- 顶栏（居中 logo，随页面滚动，无背景） ---------- */
header{
  /* 普通文档流，随滚动移动 */
}
.header-inner{
  display:flex;align-items:center;justify-content:center;
  padding-top:50px;
}
.logo{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-decoration:none;color:var(--text);
}
.logo img{width:56px;height:56px;border-radius:12px;display:block}
.logo-text{
  font-family:'Fraunces',serif;font-weight:700;
  font-size:1.75rem;letter-spacing:.02em;line-height:1;
}
.logo-sub{font-size:.72rem;color:var(--text2);letter-spacing:.12em}

/* ---------- Safari 提示 ---------- */
.banner{
  display:none;background:rgba(255,255,255,.08);color:var(--text2);
  font-size:.78rem;text-align:center;padding:8px 16px;border-bottom:1px solid var(--border);
}
.banner.show{display:block}

/* ---------- 下拉菜单（语言 / 定时 / 播放列表） ---------- */
.dropdown{
  position:absolute;top:calc(100% + 8px);right:0;min-width:160px;
  background:#111;border:1px solid var(--border);border-radius:10px;
  padding:6px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:70;
}
.dropdown.open{display:block}
.dropdown button{
  display:block;width:100%;text-align:left;
  padding:8px 12px;font-size:.8rem;color:var(--text2);
  background:none;border:none;border-radius:6px;cursor:pointer;font-family:inherit;
}
.dropdown button:hover{background:var(--surface-hover);color:var(--text)}
.dropdown button.active{color:var(--text);background:var(--surface)}
.timer-info{font-size:.74rem;color:var(--text);padding:4px 12px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;font-variant-numeric:tabular-nums}
.timer-custom{
  display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--border);margin-top:4px;
}
.timer-custom input{
  flex:1;min-width:0;background:#18181b;border:1px solid #3f3f46;border-radius:6px;
  color:var(--text);padding:6px 8px;font-size:.78rem;font-family:inherit;outline:none;
  transition:border-color .15s;
}
.timer-custom input:focus{border-color:#52525b}
.timer-custom input.invalid{border-color:#f87171;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* 隐藏原生 spinner，输入框无上下箭头 */
.timer-custom input::-webkit-outer-spin-button,
.timer-custom input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.timer-custom input{-moz-appearance:textfield}
.timer-custom button{
  flex:0 0 auto;width:auto;background:#18181b;border:1px solid #3f3f46;border-radius:6px;
  color:var(--text);padding:0 12px;font-size:.78rem;cursor:pointer;font-family:inherit;
}
.timer-custom button:hover{background:#27272a}

/* 播放列表面板 */
.pl-title{
  font-size:.72rem;color:var(--text2);letter-spacing:.08em;
  padding:4px 12px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;
}

/* ---------- 分类区块 ---------- */
.section-title{
  font-size:.95rem;font-weight:700;letter-spacing:.04em;
  color:var(--text2);margin:36px 0 16px;text-align:center;
}
.section:first-child .section-title{margin-top:32px}
.grid{
  display:grid;grid-template-columns:repeat(4,170px);
  justify-content:center;gap:14px;
}

/* ---------- 声音卡片（moodist 尺寸） ---------- */
.card{
  position:relative;
  background:linear-gradient(rgb(24 24 27 / 50%), transparent);
  border:1px solid var(--border);
  border-radius:var(--radius);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 14px 24px;gap:10px;min-height:132px;transition:all .15s;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
/* 上缘高光线（moodist） */
.card:not(.playing)::before{
  position:absolute;top:-1px;left:0;width:100%;height:1px;content:'';
  background:linear-gradient(90deg,transparent,#52525b,transparent);
}
.card.playing{border-color:var(--text);background:rgba(255,255,255,0.07)}
.card.loading{opacity:.6}
.card-name{font-size:.8rem;font-weight:500;text-align:center;padding:0 6px;color:var(--text2);line-height:1.3}
/* 图标圆盘：moodist 双层渐变环 */
.card-icon{
  position:relative;z-index:2;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:all .15s;
}
.card-icon .material-symbols-outlined{font-size:20px;position:relative;z-index:2;line-height:0}
.card-icon::after{
  position:absolute;top:0;left:0;z-index:-1;width:100%;height:100%;content:'';
  background:#09090b;border-radius:50%;
}
.card-icon::before{
  position:absolute;top:-1px;left:-1px;z-index:-2;width:calc(100% + 2px);height:calc(100% + 2px);content:'';
  background:linear-gradient(#3f3f46,#18181b);border-radius:50%;
}
.card:hover .card-icon{color:#a1a1aa}
/* 播放时：圆形状态不变，仅图标描边变白色 */
.card.playing .card-icon{color:var(--text)}
/* 播放中划过：颜色浅一点（标题不参与 hover） */
.card.playing:hover .card-icon{color:rgba(255,255,255,.55)}
.card.playing .card-name{color:var(--text)}

/* 播放动画（均衡器）——点击弹出该声音的音量，位于卡片右下角 */
.eq{
  position:absolute;bottom:12px;right:12px;
  display:none;gap:2px;align-items:flex-end;
  cursor:pointer;padding:8px;border-radius:10px;transition:background .15s;
  z-index:5;
}
.eq:hover{background:rgba(255,255,255,.1)}
.card.playing .eq{display:flex}
.eq span{width:3px;background:var(--text);border-radius:1px;animation:eq .9s ease-in-out infinite;transform-origin:bottom}
.eq span:nth-child(1){height:10px;animation-delay:0s}
.eq span:nth-child(2){height:18px;animation-delay:.15s}
.eq span:nth-child(3){height:13px;animation-delay:.3s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* 卡片音量弹窗（点均衡器弹出，卡片内垂直居中） */
.vol-pop{
  position:absolute;top:50%;transform:translateY(-50%);right:10px;z-index:40;
  display:flex;align-items:center;gap:8px;
  background:#111;border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.6);
  width:150px;
}
.vol-pop .pl-vol{flex:1;min-width:0}
.vol-pop-val{font-size:.72rem;color:var(--text2);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* 音量滑杆（moodist 复刻，位于底部播放列表面板） */
.pl-item{
  display:flex;align-items:center;gap:10px;
  padding:6px 8px;border-radius:8px;transition:background .15s;
}
/* 行 hover：极淡背景，仅给一点反馈（名字本身无 hover 背景） */
.pl-item:hover{background:rgba(255,255,255,.04)}
.pl-name{
  flex:0 0 auto;max-width:110px;
  background:none;border:none;padding:3px 0;
  font-family:inherit;font-size:.8rem;color:var(--text);text-align:left;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .15s;
}
.pl-item:hover .pl-name{color:#fff}
/* 去掉 .dropdown button:hover 全局规则给名字加的背景 */
.dropdown .pl-name:hover{background:none}
.pl-x{
  font-size:16px;color:var(--text2);cursor:pointer;flex:0 0 auto;
  border-radius:50%;padding:3px;line-height:1;transition:all .15s;
}
.pl-item:hover .pl-x{color:var(--text)}
.pl-x:hover{background:rgba(255,255,255,.12)}
/* 滑杆 hover 提亮，提示可拖动 */
.pl-item .pl-vol:hover::-webkit-slider-runnable-track{background:#3f3f46}
.pl-item .pl-vol:hover::-moz-range-track{background:#3f3f46}
.pl-vol{
  flex:1;min-width:0;-webkit-appearance:none;appearance:none;
  background:transparent;cursor:pointer;outline:none;margin:0;
}
.pl-vol::-webkit-slider-runnable-track{
  height:8px;background:#27272a;border-radius:8px;
}
.pl-vol::-webkit-slider-thumb{
  width:14px;height:14px;margin-top:-3px;
  -webkit-appearance:none;background:#3f3f46;
  border:1px solid #52525b;border-radius:50%;
}
.pl-vol::-moz-range-track{
  height:8px;background:#27272a;border-radius:8px;
}
.pl-vol::-moz-range-thumb{
  width:14px;height:14px;background:#3f3f46;
  border:1px solid #52525b;border-radius:50%;
}
#playingMenu{width:250px}
#playingList{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}

/* ---------- 底部悬浮模块 ---------- */
.dock{
  position:fixed;bottom:24px;left:0;right:0;
  display:flex;justify-content:center;align-items:center;gap:10px;
  z-index:60;pointer-events:none;
}
.dock>*{pointer-events:auto;flex-shrink:0}
.playerbar{
  display:flex;align-items:center;gap:8px;
  background:rgba(10,10,12,0.92);
  border:1px solid var(--border);border-radius:50px;
  padding:8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.5);
  /* 注意：不能加 backdrop-filter / filter / transform ——
     它们会把 fixed 弹窗的包含块捕获到本元素，导致手机下弹窗错位 */
}
.playerbar>*{flex-shrink:0}
.bar-lang{
  position:relative;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.74rem;color:var(--text);
  background:#18181b;border:1px solid #3f3f46;
  cursor:pointer;transition:all .15s;
}
.bar-lang:hover{background:#27272a}
.bar-count{
  position:relative;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  font-size:.78rem;color:var(--text2);
  padding:0 12px;height:40px;border-radius:20px;
  border:1px solid var(--border);transition:all .15s;
  white-space:nowrap;user-select:none;
}
.bar-count b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.bar-count.has{background:#18181b;border-color:rgba(255,255,255,0.45)}
.bar-count.has b{color:var(--text)}
.bar-count.has span{color:var(--text)}
.bar-count:not(.has){cursor:default;pointer-events:none}
.bar-btn,.bar-stop{
  height:40px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:#18181b;border:1px solid #3f3f46;color:var(--text);
  cursor:pointer;transition:all .2s;font-family:inherit;
  white-space:nowrap;
}
.bar-btn{
  position:relative;border-radius:24px;padding:0 14px;font-size:.78rem;
}
.bar-btn .material-symbols-outlined{font-size:17px;color:var(--text2)}
.bar-btn:hover{background:#27272a}
.bar-btn.active{background:var(--text);border-color:var(--text);color:#000}
.bar-btn.active .material-symbols-outlined{color:#000}
.bar-stop{
  border-radius:24px;padding:0 16px;font-size:.78rem;
}
.bar-stop .material-symbols-outlined{font-size:17px}
.bar-stop:disabled{opacity:.35;cursor:default;pointer-events:none}
/* 有播放时：深色底（倒计时按钮背景样式）+ 白色描边 */
.bar-stop:not(:disabled){background:#18181b;border-color:rgba(255,255,255,0.45);color:var(--text)}
.bar-stop:not(:disabled):hover{background:#27272a}
.bar-stop:not(:disabled) .material-symbols-outlined{color:var(--text)}
.dock .dropdown{top:auto;bottom:calc(100% + 10px)}

/* ---------- 页脚 ---------- */
footer{
  text-align:center;padding:48px 0 150px;
  color:var(--text2);font-size:.8rem;
}
footer a{color:var(--text);text-decoration:none}
footer a:hover{text-decoration:underline}

/* ---------- 移动端 ---------- */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .header-inner{padding-top:40px}
  .logo img{width:48px;height:48px}
  .logo-text{font-size:1.5rem}
  /* 底部模块：小屏紧凑适配 */
  .dock{bottom:16px;gap:8px}
  .playerbar{padding:6px;gap:6px}
  .bar-lang,.bar-count,.bar-btn,.bar-stop{height:36px}
  .bar-lang{width:36px;font-size:.7rem}
  .bar-count{padding:0 10px}
  .bar-btn{padding:0 10px}
  .bar-btn .material-symbols-outlined{font-size:16px}
  .bar-stop{padding:0 12px}
  .bar-stop .material-symbols-outlined{font-size:16px}
  .bar-count span{display:none}
  /* 弹窗：手机下水平居中于屏幕、dock 上方弹出，超高可滚动 */
  .dock .dropdown{
    position:fixed;left:50%;right:auto;transform:translateX(-50%);
    bottom:96px;
    max-width:calc(100vw - 24px);
    max-height:calc(100vh - 130px);
    overflow-y:auto;
  }
  footer{padding-bottom:120px}
}
</style>
</head>

let DATA = null;

/* ---------- 分类 ---------- */
function localName(s){
  const m = {zh:'name',tw:'nameZhTW',en:'nameEn',ja:'nameJa',ko:'nameKo',ru:'nameRu'};
  return s[m[currentLang]] || s.nameEn || s.name;
}

/* ---------- 分类区块渲染 ---------- */
function cardHtml(s){
  const icon = SOUND_ICONS[s.id] || CAT_ICONS[s.category] || 'music_note';
  const isPlay = playing.has(s.id);
  return `<div class="card ${isPlay?'playing':''}" data-id="${s.id}" title="${localName(s)}">
    <div class="card-icon"><span class="material-symbols-outlined">${icon}</span></div>
    <div class="card-name">${localName(s)}</div>
    <div class="eq"><span></span><span></span><span></span></div>
  </div>`;
}
function renderSections(){
  const box = document.getElementById('sections');
  box.innerHTML = DATA.categories.map(c=>{
    const nm = {zh:c.name,tw:c.nameZhTW,en:c.nameEn,ja:c.nameJa,ko:c.nameKo,ru:c.nameRu}[currentLang] || c.nameEn || c.name;
    const list = DATA.sounds.filter(s=>s.category===c.id);
    return `<section class="section" id="cat-${c.id}">
      <h2 class="section-title">${nm}</h2>
      <div class="grid">${list.map(cardHtml).join('')}</div>
    </section>`;
  }).join('');
  box.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>toggleSound(card.dataset.id, card));
    card.querySelector('.eq').addEventListener('click', e=>{
      e.stopPropagation();
      const item = playing.get(card.dataset.id);
      if(!item) return;
      const existing = card.querySelector('.vol-pop');
      if(existing){ existing.remove(); return; }
      closeVolPops();
      const pop = document.createElement('div');
      pop.className = 'vol-pop';
      const v = Math.round(item.gain.gain.value*100);
      pop.innerHTML = `<input class="pl-vol" type="range" min="0" max="100" value="${v}"><span class="vol-pop-val">${v}%</span>`;
      pop.addEventListener('click', e=>e.stopPropagation());
      // 鼠标悬停在弹窗上时不消失，移出后重新计时
      pop.addEventListener('mouseenter', ()=>clearTimeout(volPopTimer));
      pop.addEventListener('mouseleave', ()=>arm());
      const arm = ()=>{
        clearTimeout(volPopTimer);
        volPopTimer = setTimeout(()=>closeVolPops(), 1200);
      };
      pop.querySelector('input').addEventListener('input', e=>{
        item.gain.gain.value = e.target.value/100;
        pop.querySelector('.vol-pop-val').textContent = e.target.value + '%';
        const pl = document.querySelector(`#playingList .pl-item[data-id="${card.dataset.id}"] input`);
        if(pl) pl.value = e.target.value;
        arm();
      });
      card.appendChild(pop);
      // 左侧卡片弹窗右对齐会溢出屏幕，改为从左边缘展开
      const pr = pop.getBoundingClientRect();
      if(pr.left < 8){ pop.style.left = '10px'; pop.style.right = 'auto'; }
      arm();
    });
  });
}
let volPopTimer = null;
function closeVolPops(){
  clearTimeout(volPopTimer);
  document.querySelectorAll('.vol-pop').forEach(p=>p.remove());
}

/* ---------- 音频缓存（预加载 + LRU） ---------- */
const bufCache = new Map();   // id -> ArrayBuffer（下载缓存）
const decCache = new Map();   // id -> AudioBuffer（解码缓存）
const BUF_LIMIT = 12, DEC_LIMIT = 6;
function cacheSet(map, limit, id, val){
  map.delete(id);
  map.set(id, val);
  if(map.size > limit) map.delete(map.keys().next().value);  // 淘汰最旧的
}
async function fetchBuffer(id){
  if(bufCache.has(id)) return bufCache.get(id);
  const s = DATA.sounds.find(x=>x.id===id);
  if(!s) return null;
  const res = await fetch(s.remoteUrl);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const ab = await res.arrayBuffer();
  cacheSet(bufCache, BUF_LIMIT, id, ab);
  return ab;
}
async function getDecoded(id){
  if(decCache.has(id)) return decCache.get(id);
  const ctx = ensureCtx();
  const buf = await fetchBuffer(id);
  const ab = await ctx.decodeAudioData(buf);
  cacheSet(decCache, DEC_LIMIT, id, ab);
  return ab;
}
/* 首屏预取：页面加载后静默下载前 8 个声音（只下载不解码） */
async function prefetchFirstScreen(){
  await Promise.allSettled(DATA.sounds.slice(0, 8).map(s=>fetchBuffer(s.id)));
}

/* ---------- 播放控制（Web Audio 无缝循环） ---------- */
let audioCtx = null;
function ensureCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
const loadingIds = new Set();
async function toggleSound(id, card){
  closeVolPops();
  if(playing.has(id)){ stopOne(id); return; }
  if(loadingIds.has(id)) return;   // 正在下载/解码，忽略重复点击
  const s = DATA.sounds.find(x=>x.id===id);
  if(!s) return;
  card.classList.add('loading');
  loadingIds.add(id);
  try{
    const ctx = ensureCtx();
    const ab = await getDecoded(id);   // 命中解码/下载缓存时秒开
    if(!loadingIds.has(id)) return;  // 期间被取消
    const src = ctx.createBufferSource();
    src.buffer = ab;
    src.loop = true;                 // 采样级无缝循环
    const gain = ctx.createGain();
    gain.gain.value = 0.8;
    src.connect(gain).connect(ctx.destination);
    src.start();
    playing.set(id, {src, gain, el:card});
    card.classList.remove('loading');
    card.classList.add('playing');
    updateCount();
  }catch(e){
    card.classList.remove('loading');
    playing.delete(id);
    updateCount();
  }finally{
    loadingIds.delete(id);
  }
}

/* 停止单个声音 */
function stopOne(id){
  closeVolPops();
  const item = playing.get(id);
  if(item){
    try{ item.src.stop(); }catch(_){}
    try{ item.src.disconnect(); }catch(_){}
    try{ item.gain.disconnect(); }catch(_){}
    playing.delete(id);
  }
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(card) card.classList.remove('playing','loading');
  updateCount();
  if(playing.size===0) closeDropdown('playingMenu');
}

function stopAll(){
  closeVolPops();
  playing.forEach((item)=>{
    try{ item.src.stop(); }catch(_){}
    try{ item.src.disconnect(); }catch(_){}
    try{ item.gain.disconnect(); }catch(_){}
  });
  playing.clear();
  document.querySelectorAll('.card.playing,.card.loading').forEach(c=>c.classList.remove('playing','loading'));
  updateCount();
  closeDropdown('playingMenu');
}

/* 更新计数 + 播放列表 + 停止键状态 */
function updateCount(){
  const n = playing.size;
  document.getElementById('playingCount').textContent = n;
  document.getElementById('stopAllBtn').disabled = n === 0;
  document.getElementById('countBtn').classList.toggle('has', n>0);
  renderPlayingList();
}
function renderPlayingList(){
  const box = document.getElementById('playingList');
  if(playing.size===0){ box.innerHTML=''; return; }
  box.innerHTML = [...playing.keys()].map(id=>{
    const s = DATA.sounds.find(x=>x.id===id);
    const vol = Math.round(playing.get(id).gain.gain.value*100);
    return `<div class="pl-item" data-id="${id}">
      <button class="pl-name" title="${localName(s)}">${localName(s)}</button>
      <input class="pl-vol" type="range" min="0" max="100" value="${vol}" data-vol="${id}">
      <span class="material-symbols-outlined pl-x">stop_circle</span>
    </div>`;
  }).join('');
  box.querySelectorAll('.pl-item').forEach(it=>{
    const id = it.dataset.id;
    it.querySelector('.pl-name').addEventListener('click', ()=>stopOne(id));
    it.querySelector('.pl-x').addEventListener('click', ()=>stopOne(id));
    const vol = it.querySelector('input[data-vol]');
    vol.addEventListener('click', e=>e.stopPropagation());
    vol.addEventListener('input', e=>{
      const a = playing.get(e.target.dataset.vol);
      if(a) a.gain.gain.value = e.target.value/100;
    });
  });
}

/* ---------- 定时 ---------- */
let timerEnd = 0, timerId = null;
function timerText(){
  const remain = Math.max(0, Math.round((timerEnd-Date.now())/1000));
  return `${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}`;
}
function setTimer(min){
  clearInterval(timerId);
  timerEnd = min>0 ? Date.now()+min*60000 : 0;
  const btn = document.getElementById('timerBtn');
  const info = document.getElementById('timerInfo');
  const label = document.getElementById('timerLabel');
  if(min>0){
    btn.classList.add('active');
    const tick = ()=>{
      const t = timerText();
      info.textContent = t;
      label.textContent = t;
      if(timerEnd-Date.now()<=0){ stopAll(); setTimer(0); }
    };
    tick();
    timerId = setInterval(tick, 500);
  }else{
    btn.classList.remove('active');
    info.textContent = LANG[currentLang].timerOff;
    label.textContent = LANG[currentLang].timer;
  }
  closeDropdown('timerMenu');
}

/* ---------- 下拉 ---------- */
function closeDropdown(id){
  document.getElementById(id).classList.remove('open');
}
document.getElementById('timerBtn').addEventListener('click', e=>{
  e.stopPropagation();
  document.getElementById('timerMenu').classList.toggle('open');
  document.getElementById('langMenu').classList.remove('open');
  document.getElementById('playingMenu').classList.remove('open');
});
document.getElementById('langBtn').addEventListener('click', e=>{
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
  document.getElementById('timerMenu').classList.remove('open');
  document.getElementById('playingMenu').classList.remove('open');
});
document.getElementById('countBtn').addEventListener('click', e=>{
  e.stopPropagation();
  if(playing.size===0) return;
  document.getElementById('playingMenu').classList.toggle('open');
  document.getElementById('timerMenu').classList.remove('open');
  document.getElementById('langMenu').classList.remove('open');
});
document.addEventListener('click', ()=>{
  closeDropdown('timerMenu'); closeDropdown('langMenu'); closeDropdown('playingMenu');
});
document.getElementById('timerMenu').querySelectorAll('button[data-min]').forEach(b=>{
  b.addEventListener('click', ()=>setTimer(parseInt(b.dataset.min)));
});
document.getElementById('timerCustomBtn').addEventListener('click', e=>{
  e.stopPropagation();
  const input = document.getElementById('timerCustomInput');
  const v = parseInt(input.value);
  if(v>0 && v<=600){ input.classList.remove('invalid'); setTimer(v); return; }
  // 无效输入：红框 + 抖动反馈，避免静默无反应
  input.classList.remove('invalid');
  void input.offsetWidth;
  input.classList.add('invalid');
  input.focus();
  setTimeout(()=>input.classList.remove('invalid'), 1200);
});

document.getElementById('timerCustomInput').addEventListener('click', e=>e.stopPropagation());
document.getElementById('timerCustomInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const input = e.target;
    const v = parseInt(input.value);
    if(v>0 && v<=600) setTimer(v);
    else{ input.classList.remove('invalid'); void input.offsetWidth; input.classList.add('invalid'); input.focus(); setTimeout(()=>input.classList.remove('invalid'), 1200); }
  }
});
document.getElementById('langMenu').querySelectorAll('button[data-lang]').forEach(b=>{
  b.addEventListener('click', ()=>applyLang(b.dataset.lang));
});
document.getElementById('stopAllBtn').addEventListener('click', stopAll);

/* ---------- 语言 ---------- */
function applyLang(lang){
  if(!LANG[lang]) return;
  currentLang = lang;
  const L = LANG[lang];
  try{ localStorage.setItem(LANG_KEY, lang); }catch(_){}
  document.documentElement.lang = HTML_LANG_MAP[lang];
  document.getElementById('langLabel').textContent = LANG_LABEL[lang];
  document.querySelectorAll('[lang-key]').forEach(el=>{
    const k = el.getAttribute('lang-key');
    if(L[k]) el.textContent = L[k];
  });
  if(timerEnd>0) document.getElementById('timerLabel').textContent = timerText();
  if(HTML_LANG_MAP[lang] && document.title) document.title = L.title;
  const meta = document.querySelector('meta[name="description"]');
  if(meta && L.desc) meta.setAttribute('content', L.desc);
  if(timerEnd===0) document.getElementById('timerInfo').textContent = L.timerOff;
  const cInput = document.getElementById('timerCustomInput');
  if(cInput && L.timerCustom) cInput.placeholder = L.timerCustom;
  document.querySelectorAll('#langMenu button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });
  renderSections();
  renderPlayingList();
}

/* ---------- 初始化 ---------- */
(async function init(){
  // Safari / Ogg 检测
  const a = document.createElement('audio');
  const oggOk = a.canPlayType ? !!(a.canPlayType('audio/ogg') || a.canPlayType('audio/ogg; codecs="vorbis"')) : false;
  if(!oggOk) document.getElementById('safariBanner').classList.add('show');

  // 使用内嵌声音清单（与 App 的 sounds_remote.json 同步）
  DATA = BUILTIN_DATA;
  let saved = null;
  try{ saved = localStorage.getItem(LANG_KEY); }catch(_){}
  applyLang(saved && LANG[saved] ? saved : 'zh');
  // 静默预取首屏声音（避开首帧渲染竞争）
  const idle = window.requestIdleCallback || (fn=>setTimeout(fn, 300));
  idle(()=>{ prefetchFirstScreen().catch(()=>{}); });
})();
</script>
